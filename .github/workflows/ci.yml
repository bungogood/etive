name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/architecture-throughput/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check CubeCL CPU backend
        run: cargo check --locked --no-default-features --features cpu
      - name: Check architecture benchmark
        run: cargo check --locked --manifest-path benchmarks/architecture-throughput/Cargo.toml
      - name: Test
        run: cargo test --locked --release
      - name: Run deep perft tests
        run: cargo test --locked --release published_deep_initial_position_perft -- --ignored --exact
